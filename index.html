<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IFT | بضاعة الأمانة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#0B3866;--blue2:#134A86;--blue-lg:#E8EFF8;
  --green:#54A437;--green-d:#3F812A;--green-lg:#EAF4E6;
  --paper:#F1F5F9;--card:#fff;
  --ok:#2F7A4D;--ok-bg:#E6F2EA;
  --bad:#B23A33;--bad-bg:#FBE9E7;
  --warn:#C9952B;--warn-bg:#FBF1DD;
  --muted:#64748B;--line:#E2E8F0;
  --r:14px;--sh:0 2px 8px rgba(11,56,102,.08);--shl:0 8px 24px rgba(11,56,102,.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Cairo',sans-serif;background:var(--paper);color:var(--blue);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}
#app{max-width:640px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden;}

/* WELCOME */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--blue) 0%,#0a2f55 70%,#061d35 100%);color:#fff;padding:48px 28px;text-align:center;overflow-y:auto;}
.wlogo{width:100px;height:100px;border-radius:24px;background:#fff;padding:8px;margin-bottom:24px;box-shadow:0 16px 40px rgba(0,0,0,.3);object-fit:contain;}
.welcome h1{font-size:26px;font-weight:900;margin-bottom:6px;}
.corp{font-size:10px;letter-spacing:3px;color:#8BB4D4;margin-bottom:12px;}
.welcome p{color:#A8C4DA;font-size:13px;line-height:2;max-width:300px;margin-bottom:28px;}
.stages{display:flex;gap:5px;margin-bottom:32px;flex-wrap:wrap;justify-content:center;}
.stages span{font-size:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);padding:4px 10px;border-radius:999px;color:#C5DCF0;}
.btn-primary{background:var(--green);color:#fff;padding:15px 0;width:100%;max-width:300px;border-radius:13px;font-weight:800;font-size:15px;transition:.15s;box-shadow:0 10px 24px rgba(84,164,55,.35);}
.btn-primary:active{transform:scale(.97);background:var(--green-d);}
.musicbtn{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#C5DCF0;font-size:11.5px;font-weight:700;padding:8px 16px;border-radius:999px;margin-bottom:22px;transition:.15s;}
.musicbtn:active{transform:scale(.96);}
.musicbtn.on{background:rgba(84,164,55,.18);border-color:var(--green);color:#fff;}
.musicbtn .bars{display:inline-flex;align-items:flex-end;gap:2px;height:11px;}
.musicbtn .bars i{width:2px;background:var(--green);border-radius:1px;display:block;}
.musicbtn.on .bars i{animation:bar 0.9s ease-in-out infinite;}
.musicbtn .bars i:nth-child(1){height:4px;animation-delay:0s;}
.musicbtn .bars i:nth-child(2){height:9px;animation-delay:.15s;}
.musicbtn .bars i:nth-child(3){height:6px;animation-delay:.3s;}
@keyframes bar{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}
.greetbar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--blue-lg),#fff);border:1px solid var(--blue2);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;font-weight:800;color:var(--blue);}
.musicmini{width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid var(--blue2);font-size:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.musicmini.on{background:var(--green-lg);border-color:var(--green);}
.cntcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:8px;cursor:pointer;transition:.12s;}
.cntcard:active{transform:scale(.985);}
.cntcard-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.cntcard-badge{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--paper);}
.cntcard-code{font-size:13px;font-weight:800;color:var(--blue);flex:1;}
.cntcard-cap{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--paper);padding:2px 8px;border-radius:999px;}
.cntcard-row{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;padding:3px 0;gap:8px;}
.cntcard-row b{color:var(--ok);font-weight:800;text-align:left;}
.cntcard-row.muted{color:var(--muted);font-size:10.5px;}
.repgrp.hide{display:none;}
#repgrpbar button{font-weight:800;}
.chkgrid{display:flex;flex-direction:column;gap:7px;max-height:170px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:10px;background:#fff;}
.chkitem{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;}
.chkitem input{width:15px;height:15px;}
.labrow{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:8px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.chip{background:var(--blue-lg);color:var(--blue2);font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:999px;}

/* SIGNIN */
.signin{flex:1;display:flex;flex-direction:column;justify-content:center;padding:36px 24px;overflow-y:auto;}
.slogo{width:58px;height:58px;border-radius:16px;background:#fff;padding:6px;margin-bottom:16px;box-shadow:var(--shl);object-fit:contain;border:1px solid var(--line);}
.signin h2{font-size:22px;font-weight:800;margin-bottom:4px;}
.signin .sub{color:var(--muted);font-size:13px;margin-bottom:24px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--blue2);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:14px;color:var(--blue);transition:border-color .15s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.err{background:var(--bad-bg);color:var(--bad);font-size:13px;padding:10px 12px;border-radius:9px;margin-bottom:14px;font-weight:600;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* TOPBAR */
.topbar{background:var(--blue);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.22);}
.brand{display:flex;align-items:center;gap:10px;}
.tlogo{width:34px;height:34px;border-radius:9px;background:#fff;padding:3px;object-fit:contain;}
.tname{font-size:13px;font-weight:800;}
.trole{font-size:10px;color:#8BB4D4;}
.logout{background:rgba(255,255,255,.1);color:#fff;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;}

/* TABBAR */
.tabbar{flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding:5px 2px calc(5px + env(safe-area-inset-bottom));}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 1px;background:none;color:var(--muted);font-size:9.5px;font-weight:700;border-radius:10px;}
.tabbar .ic{font-size:17px;}
.tabbar button.active{color:var(--blue);}

.stitle{padding:16px 16px 2px;font-size:18px;font-weight:900;color:var(--blue);}
.ssub{padding:0 16px 10px;font-size:12px;color:var(--muted);}
.content{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 24px;}

/* CARDS */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:11px;box-shadow:var(--sh);}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.ctitle{font-weight:800;font-size:14px;}
.cmeta{font-size:11px;color:var(--muted);margin-top:2px;}
.tag{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;}
.ta{background:var(--ok-bg);color:var(--ok);}
.tw{background:var(--warn-bg);color:var(--warn);}
.tt{background:var(--blue-lg);color:var(--blue2);}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:2.5px 0;color:#3a4a60;}
.kv b{color:var(--blue);font-weight:700;}

/* TRACKER */
.tracker{position:relative;margin:12px 0 4px;padding-top:4px;}
.trk-line{position:absolute;top:11px;height:2px;background:var(--line);z-index:1;}
.trk-prog{position:absolute;top:11px;height:2px;background:var(--ok);z-index:1;transition:width .2s;}
.trk-dots{display:flex;align-items:flex-start;position:relative;z-index:2;}
.seg{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);z-index:2;border:2px solid #fff;}
.seg.done .dot{background:var(--ok);}
.seg.now .dot{background:var(--green);box-shadow:0 0 0 4px rgba(84,164,55,.2);}
.seg.rej .dot{background:var(--bad);}
.tlbl{font-size:8px;color:var(--muted);margin-top:5px;text-align:center;line-height:1.3;}
.seg.now .tlbl{color:var(--green);font-weight:800;}
.seg.rej .tlbl{color:var(--bad);font-weight:800;}

/* BUTTONS */
.brow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.bs{padding:10px 12px;border-radius:9px;font-size:12px;font-weight:800;flex:1;text-align:center;transition:.12s;border:none;}
.bok{background:var(--ok);color:#fff;}
.bbad{background:var(--bad);color:#fff;}
.bgo{background:var(--blue);color:#fff;}
.bgreen{background:var(--green);color:#fff;}
.bghost{background:#fff;color:var(--blue);border:1.5px solid var(--line) !important;}
.bs:active{opacity:.85;transform:scale(.97);}

/* MISC */
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .ic{font-size:36px;margin-bottom:10px;}
.empty .t{font-weight:800;color:var(--blue);font-size:14px;margin-bottom:4px;}
.segtog{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:16px;}
.segtog button{flex:1;padding:13px 0;font-weight:800;font-size:13px;background:#fff;color:var(--muted);}
.segtog button.on{background:var(--blue);color:#fff;}
.slabel{font-size:10.5px;font-weight:800;color:var(--blue2);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px;}
.lkname{font-size:11px;color:var(--ok);margin-top:3px;font-weight:700;min-height:13px;}
.lkname.miss{color:var(--bad);}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.25);white-space:nowrap;pointer-events:none;}
.balbox{background:var(--blue-lg);border:1.5px solid var(--blue2);border-radius:10px;padding:10px 12px;margin-bottom:13px;font-size:12.5px;line-height:1.8;}
.balok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
.balbad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.rbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;}
.rbox .big{font-size:24px;font-weight:900;color:var(--blue);}
.rbox .lab{font-size:10px;color:var(--muted);font-weight:700;}
.pillbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;}
.pillbar::-webkit-scrollbar{display:none;}
.pillbar button{white-space:nowrap;padding:7px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);}
.pillbar button.on{background:var(--blue);color:#fff;border-color:var(--blue);}

/* CALENDAR STRIP */
.calwrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;margin-bottom:12px;box-shadow:var(--sh);}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;}
.calhead .calnav{background:var(--blue-lg);color:var(--blue);width:26px;height:26px;border-radius:8px;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.calhead .caltitle{font-size:12.5px;font-weight:800;color:var(--blue);}
.calhead .caltoday{font-size:10.5px;font-weight:800;color:var(--green);background:var(--green-lg);padding:4px 9px;border-radius:999px;}
.calrow{display:flex;gap:4px;}
.calday{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:10px;background:var(--paper);position:relative;}
.calday .cwd{font-size:9px;color:var(--muted);font-weight:700;}
.calday .cnum{font-size:13px;font-weight:800;color:var(--blue);}
.calday .cdot{width:4px;height:4px;border-radius:50%;background:var(--green);position:absolute;bottom:3px;}
.calday.today .cnum{color:var(--green);}
.calday.sel{background:var(--blue);}
.calday.sel .cwd{color:#C5DCF0;}
.calday.sel .cnum{color:#fff;}
.calday.sel .cdot{background:#fff;}
.calallbtn{margin-top:8px;text-align:center;font-size:11px;font-weight:800;color:var(--blue2);cursor:pointer;padding:6px;border-top:1px dashed var(--line);}
.calallbtn.on{color:var(--green);}
.schedbadge{display:inline-flex;align-items:center;gap:4px;background:var(--blue-lg);color:var(--blue2);font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;margin-top:6px;}
table.rep{width:100%;border-collapse:collapse;font-size:11px;}
table.rep th,table.rep td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right;}
table.rep th{color:var(--muted);font-weight:800;font-size:10px;background:var(--paper);}
.urow{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:7px;}
.sw{width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;cursor:pointer;}
.sw.on{background:var(--ok);}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:right .15s;}
.sw.on::after{right:20px;}
.attachbtn{display:flex;align-items:center;gap:8px;background:var(--blue-lg);border:1.5px dashed var(--blue2);border-radius:10px;padding:11px 14px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--blue2);margin-bottom:13px;width:100%;}
.attachprev{background:var(--ok-bg);border:1px solid var(--ok);border-radius:10px;padding:9px 12px;margin-bottom:13px;font-size:12px;color:var(--ok);font-weight:700;}
.ew{color:var(--warn);font-weight:800;}
.eb{color:var(--bad);font-weight:800;}
.eo{color:var(--ok);}

/* ANIMATION — full screen route scene */
.anim-overlay{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;background:linear-gradient(180deg,#040d18 0%,#0B3866 55%,#040d18 100%);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
.anim-scene{display:flex;align-items:center;justify-content:space-between;width:92%;max-width:560px;position:relative;padding:0 4px;}
.anim-point{display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;width:84px;}
.anim-point .ic{font-size:46px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4));}
.anim-point .lbl{color:#cfe3f7;font-size:11px;font-weight:800;text-align:center;line-height:1.3;}
.anim-road{position:absolute;top:23px;left:84px;right:84px;height:5px;background:rgba(255,255,255,.12);border-radius:2px;}
.anim-road::after{content:'';position:absolute;top:50%;left:0;right:0;border-top:2px dashed rgba(255,255,255,.3);}
.anim-truckwrap{position:absolute;top:-21px;font-size:50px;animation:drive 2.4s cubic-bezier(.4,0,.2,1) forwards;}
.anim-truckwrap .logobadge{position:absolute;top:4px;left:13px;width:20px;height:20px;border-radius:5px;background:#fff;padding:1px;box-shadow:0 1px 4px rgba(0,0,0,.4);}
@keyframes drive{0%{left:calc(100% - 38px);opacity:0;}10%{opacity:1;}90%{opacity:1;}100%{left:0%;opacity:1;}}
.anim-msg{color:#fff;font-size:16px;font-weight:800;margin-top:38px;text-align:center;padding:0 24px;}
.anim-corp{color:#8BB4D4;font-size:11px;letter-spacing:2px;margin-top:6px;}
.anim-bar{width:220px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:16px;overflow:hidden;}
.anim-bar::after{content:'';display:block;height:100%;background:var(--green);border-radius:2px;animation:prog 2.4s linear forwards;}
@keyframes prog{0%{width:0%;}100%{width:100%;}}

@media(min-width:640px){#app{box-shadow:0 0 40px rgba(11,56,102,.12);}}
@media print{.tabbar,.topbar,.brow,.pillbar,button,[data-a]{display:none!important;}body{background:#fff;}.content{padding:0;}.card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid;}}

/* MANIFEST — كشف تحرك المندوب (صفحة طباعة مستقلة بالعرض) */
.manifest-outer{background:#e9edf2;min-height:100vh;padding:18px 12px 40px;}
.manifest-bar{max-width:1000px;margin:0 auto 14px;display:flex;gap:8px;justify-content:flex-end;}
.manifest-bar button{padding:9px 16px;border-radius:9px;font-size:12.5px;font-weight:800;}
.mpaper{background:#fff;max-width:1000px;margin:0 auto;padding:22px 26px;box-shadow:0 4px 18px rgba(0,0,0,.12);border-radius:6px;}
.mhead{display:flex;align-items:center;justify-content:space-between;border-bottom:2.5px solid var(--blue);padding-bottom:12px;margin-bottom:14px;}
.mhead .mh-l{display:flex;align-items:center;gap:10px;}
.mhead .mh-l img{width:46px;height:46px;border-radius:9px;object-fit:contain;}
.mhead h2{font-size:16px;font-weight:900;color:var(--blue);}
.mhead .mh-sub{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;}
.mhead .mh-r{text-align:left;font-size:11px;color:var(--muted);font-weight:700;}
.mdrv{display:flex;gap:26px;margin-bottom:16px;flex-wrap:wrap;}
.mdrv-card{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 16px;}
.mdrv-card img{width:44px;height:44px;object-fit:cover;border:1.5px solid var(--blue2);}
.mdrv-card img.round{border-radius:50%;}
.mdrv-card img.sq{border-radius:8px;}
.mdrv-card .mdrv-lbl{font-size:9.5px;color:var(--muted);font-weight:700;}
.mdrv-card .mdrv-val{font-size:13px;font-weight:900;color:var(--blue);}
table.mtbl{width:100%;border-collapse:collapse;font-size:10.5px;}
table.mtbl th{background:var(--blue);color:#fff;font-weight:800;padding:7px 5px;text-align:center;}
table.mtbl td{padding:6px 5px;border-bottom:1px solid #ddd;text-align:center;}
table.mtbl tr:nth-child(even) td{background:#f6f8fa;}
.msig{display:flex;justify-content:space-between;margin-top:34px;padding-top:10px;}
.msig .sigbox{width:44%;text-align:center;}
.msig .sigline{border-top:1.5px solid #333;margin-top:38px;padding-top:5px;font-size:11px;font-weight:800;color:var(--muted);}
@media print{
  @page{size:A4 landscape;margin:8mm;}
  .manifest-outer{background:#fff;padding:0;}
  .mpaper{box-shadow:none;max-width:100%;padding:4mm 8mm;border-radius:0;}
}

  .bottom-logo{position:fixed !important;bottom:60px;left:12px !important;right:auto !important;z-index:25;width:44px;height:44px;border-radius:10px;background:#fff;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.15);object-fit:contain;opacity:.85;}
  @media(max-width:640px){.bottom-logo{bottom:58px;left:8px !important;right:auto !important;width:38px;height:38px;}}

  /* ===== وضع النهار / الليل ===== */
  :root{
    --bg-opacity:.92;
    --overlay:rgba(241,245,249,0.88);
    --text-on-bg:var(--blue);
  }
  [data-night="1"]{
    --overlay:rgba(10,20,40,0.88);
    --text-on-bg:#e8f0fe;
    --paper:#0d1b2e;
    --card:#112240;
    --line:#1e3a5f;
    --muted:#7fa8cc;
    --blue:#a8ccef;
    --blue2:#cce0ff;
    --ink:#e8f0fe;
  }
  [data-night="1"] .topbar{background:#061525;}
  [data-night="1"] .tabbar{background:#0d1b2e;border-color:#1e3a5f;}
  [data-night="1"] .tabbar button{color:#4a7a9b;}
  [data-night="1"] .tabbar button.active{color:#54A437;}
  [data-night="1"] .field input,
  [data-night="1"] .field select,
  [data-night="1"] .field textarea{background:#0d1b2e;color:#e8f0fe;border-color:#1e3a5f;}

  /* ===== الخلفية المتحركة ===== */
  .bg-canvas{
    position:fixed;top:0;left:0;right:0;bottom:0;
    z-index:0;pointer-events:none;overflow:hidden;
    transition:opacity .6s ease;
  }
  .bg-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    z-index:1;pointer-events:none;
    background:var(--overlay);
    backdrop-filter:blur(0px);
    transition:background .6s ease;
  }
  #app > *:not(.bg-canvas):not(.bg-overlay){position:relative;z-index:2;}
  .topbar,.tabbar,.toast,.bottom-logo{z-index:50 !important;}

  /* رسوم الحيوانات والخلفيات SVG */
  .bg-canvas svg{position:absolute;opacity:.18;transition:opacity .6s;}
  [data-night="1"] .bg-canvas svg{opacity:.25;}
  .brand-watermark{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:240px;max-width:55vw;opacity:.11;pointer-events:none;filter:grayscale(15%);}
  [data-night="1"] .brand-watermark{opacity:.16;}

  @keyframes float1{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-18px) rotate(3deg);}}
  @keyframes float2{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-12px) rotate(-4deg);}}
  @keyframes drift{0%{transform:translateX(-60px);}100%{transform:translateX(calc(100vw + 60px));}}
  @keyframes pulse-bg{0%,100%{opacity:.15;}50%{opacity:.28;}}
  @keyframes rise{0%{transform:translateY(20px);opacity:0;}100%{transform:translateY(0);opacity:1;}}

  .bg-anim-1{animation:float1 6s ease-in-out infinite;}
  .bg-anim-2{animation:float2 8s ease-in-out infinite 1s;}
  .bg-anim-3{animation:float1 10s ease-in-out infinite 3s;}
  .bg-anim-drift{animation:drift 22s linear infinite;}
  .bg-pulse{animation:pulse-bg 4s ease-in-out infinite;}

  /* ===== عناصر الطقس الحقيقي ===== */
  @keyframes fall{0%{transform:translateY(-10vh);opacity:0;}10%{opacity:.6;}100%{transform:translateY(110vh);opacity:.15;}}
  .wdrop{position:absolute;top:-8%;font-size:15px;animation:fall 2.4s linear infinite;opacity:.55;}
  .wdrop.wsnow{animation-duration:7s;font-size:13px;}
  .wcloudbig{position:absolute;font-size:44px;opacity:.35;}
  .wsun{position:absolute;font-size:60px;opacity:.4;}
  .wmoon{position:absolute;font-size:48px;opacity:.5;}
  .wray{position:absolute;font-size:13px;opacity:.5;animation:pulse-bg 3s ease-in-out infinite;}
  .wstar{position:absolute;font-size:9px;color:#fff;opacity:.7;animation:pulse-bg 2.5s ease-in-out infinite;}

  /* زرار النهار/الليل */
  .theme-toggle{
    background:rgba(255,255,255,.15);border:none;
    color:#fff;font-size:16px;padding:6px 10px;
    border-radius:9px;cursor:pointer;
    transition:.2s;line-height:1;
  }
  .theme-toggle:active{transform:scale(.92);}
</style>

// تسجيل دخول صامت (Anonymous Auth) — لازم عشان قواعد الأمان الجديدة اللي بتمنع أي حد من النت
async function ensureFirebaseAuth(){
  if(!IS_CONFIGURED || !firebase.auth) return true;
  try{
    if(firebase.auth().currentUser) return true;
    await firebase.auth().signInAnonymously();
    return true;
  }catch(e){
    console.error('Firebase auth error', e);
    return false;
  }
}

async function dbGet(k, fb){
  if(!FDB) return fb;
  try{
    const snap = await FDB.ref(ROOT+k).once('value');
    const val = snap.val();
    return val !== null ? val : fb;
  }catch(e){ return fb; }
}

async function dbSet(k, v){
  if(!FDB) return;
  try{ await FDB.ref(ROOT+k).set(v); }catch(e){ console.error('Firebase write error',e); }
}

function startRealTimeSync(){
  if(!FDB) return;
  FDB.ref(ROOT+'ift_orders').on('value', snap=>{
    const val=snap.val();
    if(val!==null && S.screen==='app'){
      const prevOrders=DB.orders;
      DB.orders=val;
      checkNewTasksNotify(prevOrders,val);
      if(S.tab==='home'||S.tab==='rep'||S.tab==='bal') render();

function repOptions(){const set=new Set();DB.users.filter(u=>u.role==='rep').forEach(u=>set.add((u.name||'').trim()));DB.orders.forEach(o=>{if(o.repName)set.add(o.repName.trim());});return[...set].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar'));}
function carOptions(){const set=new Set();DB.orders.forEach(o=>{if(o.carNo)set.add(o.carNo.trim());});return[...set].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar'));}
function sname(code){const s=DB.sectors.find(x=>x.code===code);return s?s.name:'';}
function lname(code){const l=DB.labs.find(x=>x.code===code);return l?l.name:'';}
function cnname(code){const c=DB.counters.find(x=>x.code===code);return c?(c.name?c.code+' — '+c.name:c.code):'';}
function ccap(code){const c=DB.counters.find(x=>x.code===code);return c&&c.capacity?c.capacity+' لتر':'-';}
function labCodes(l){return(l.custCodes&&l.custCodes.length)?l.custCodes:(l.custCode?[l.custCode]:[]);}
function labsForCustomer(ccode){return DB.labs.filter(l=>labCodes(l).includes(ccode));}
function labCustNames(l){const cs=labCodes(l);return cs.length?cs.map(cc=>fc(cc)?.name||cc).join(' + '):'بدون عملاء';}
// رصيد المعمل (بعد الصرف): مفتاحه معمل|صنف|باتش تماماً زي رصيد المخزن لكن بكود المعمل بدل كود العميل
function glb(labCode,custCode,icode,batch){return DB.labBalances[lbk(labCode,custCode,icode,batch)]||0;}
// رصيد الكونتر: بالمخزن (location='WH') أو عند معمل معيّن (location=labCode)
function cbal(location,code){return DB.counterBalances[location+'|'+code]||0;}
// ملخص واضح لحالة الكونتر: مين معاه دلوقتي وآخر حركة ليه — للعرض السريع في القوائم
function counterSummary(code){
  const wh=cbal('WH',code);
  const labHolds=DB.labs.map(l=>({l,qty:cbal(l.code,code)})).filter(x=>x.qty>0);
  let holderParts=[];
  if(wh>0)holderParts.push(`📥 بالمخزن (${wh})`);
  labHolds.forEach(({l,qty})=>holderParts.push(`🏭 ${l.name} (${qty})`));
  const holderText=holderParts.length?holderParts.join(' + '):'لا يوجد رصيد حالي';
  const logs=DB.counterLog.filter(x=>x.counterCode===code).sort((a,b)=>(b.at||0)-(a.at||0));
  const last=logs[0];
  const locLbl=loc=>loc==='WH'?'المخزن':(DB.labs.find(l=>l.code===loc)?.name||loc);
  const lastMoveText=last?`${last.reason}${last.locTo?' → '+locLbl(last.locTo):''} · ${new Date(last.at).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`:'لا توجد حركات مسجّلة بعد';
  return{holderText,lastMoveText,lastAt:last?last.at:0};
}

/* ===== تحديد اسم المنطقة من الإحداثيات (لخريطة أكثر المناطق زيارة) ===== */
const AREA_CACHE=JSON.parse(localStorage.getItem('ift_area_cache')||'{}');
let _areaLookupBusy=false;
async function resolveAreaNames(coordsList){
  const missing=[...new Set(coordsList)].filter(c=>!AREA_CACHE[c]);
  if(!missing.length||_areaLookupBusy)return;
  _areaLookupBusy=true;
  for(const c of missing.slice(0,8)){ // حد أقصى لكل مرة حتى لا نثقل الشبكة
    try{
      const[lat,lon]=c.split(',');
      const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ar`);
      const j=await r.json();
      AREA_CACHE[c]=j.locality||j.city||j.principalSubdivision||'غير معروفة';
    }catch(e){ AREA_CACHE[c]='غير معروفة'; }
  }
  localStorage.setItem('ift_area_cache',JSON.stringify(AREA_CACHE));
  _areaLookupBusy=false;
  if(S.tab==='rep')render();
}
function uid(p){return p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

let WEATHER={code:null,isDay:true,temp:null,loaded:false};
async function loadWeather(){
  const applyCoords=async(lat,lon)=>{
    try{
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      const j=await r.json();
      if(j&&j.current_weather){
        WEATHER={code:j.current_weather.weathercode,isDay:j.current_weather.is_day===1,temp:j.current_weather.temperature,loaded:true};
        _lastBGTab=null;updateBG();
      }
    }catch(e){/* تجاهل — تبقى الخلفية الافتراضية */}
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>applyCoords(pos.coords.latitude,pos.coords.longitude),
      ()=>applyCoords(30.0444,31.2357), // القاهرة كموقع افتراضي عند رفض الإذن
      {timeout:6000}
    );
  } else { applyCoords(30.0444,31.2357); }
}

function weatherType(code){
  if(code==null)return 'clear';
  const rain=[51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99];
  const snow=[71,73,75,77,85,86];
  const cloud=[1,2,3,45,48];
  if(rain.includes(code))return 'rain';
  if(snow.includes(code))return 'snow';
  if(cloud.includes(code))return 'cloud';
  return 'clear';
}
function weatherIcons(type,isDay){
  if(type==='rain'){
    return `<span class="wcloudbig" style="left:8%;top:5%;">☁️</span><span class="wcloudbig" style="left:58%;top:9%;">☁️</span>`+
      Array.from({length:16}).map((_,i)=>`<span class="wdrop" style="left:${(i*6.2)%100}%;animation-delay:${(i%8)*0.28}s;">💧</span>`).join('');
  }
  if(type==='snow'){
    return Array.from({length:14}).map((_,i)=>`<span class="wdrop wsnow" style="left:${(i*7)%100}%;animation-delay:${(i%7)*0.4}s;">❄️</span>`).join('');
  }
  if(type==='cloud'){
    return `<span class="wcloudbig bg-anim-drift" style="top:7%;">☁️</span><span class="wcloudbig bg-anim-drift" style="top:17%;animation-delay:-9s;">☁️</span><span class="wcloudbig bg-anim-drift" style="top:27%;animation-delay:-4s;">⛅</span>`+
      (isDay?`<span class="wsun bg-pulse" style="left:70%;top:6%;">☀️</span>`:`<span class="wmoon bg-pulse" style="left:70%;top:6%;">🌙</span>`);
  }
  if(isDay){
    return `<span class="wsun bg-pulse" style="left:70%;top:6%;">☀️</span>`+
      Array.from({length:5}).map((_,i)=>`<span class="wray" style="left:${58+i*5}%;top:${4+i*3}%;animation-delay:${i*0.4}s;">✨</span>`).join('');
  }
  return `<span class="wmoon bg-pulse" style="left:70%;top:6%;">🌙</span>`+
    Array.from({length:18}).map((_,i)=>`<span class="wstar" style="left:${(i*5.5)%100}%;top:${(i*37)%60}%;animation-delay:${(i%5)*0.6}s;">✦</span>`).join('');
}
function buildBG(tab){
  const cfg = BG_PAGES[tab] || BG_PAGES.home;
  const night = nightMode;
  const type = weatherType(WEATHER.code);
  const isDay = WEATHER.loaded ? WEATHER.isDay : (new Date().getHours()>=6 && new Date().getHours()<18);
  const dayColor = {rain:'#3b4a5a',snow:'#5b6b7a',cloud:'#4a5f73',clear:cfg.color}[type];
  const gradColor = (night||!isDay)
    ? `linear-gradient(160deg,#040d18 0%,#071424 50%,#040d18 100%)`
    : `linear-gradient(160deg,${dayColor}22 0%,${dayColor}11 50%,${dayColor}33 100%)`;
  const wHTML = weatherIcons(type, night?false:isDay);
  return `<div class="bg-canvas" id="bgCanvas" style="background:${gradColor};">${wHTML}</div><div class="bg-overlay" id="bgOverlay"><img class="brand-watermark" src="${WATERMARK}" alt=""></div>`;
}

let _lastBGTab = null;
function updateBG(){
  const tab = S.tab||'home';
  const scr = S.screen;
  const bgTab = scr==='welcome'?'welcome':scr==='signin'?'signin':tab;
  if(bgTab === _lastBGTab && document.getElementById('bgCanvas')) return;
  _lastBGTab = bgTab;
  // حذف القديم
  document.getElementById('bgCanvas')?.remove();
  document.getElementById('bgOverlay')?.remove();
  // إضافة الجديد
  const app = document.getElementById('app');
  app.insertAdjacentHTML('afterbegin', buildBG(bgTab));
}

// حساب حالة كونتر داخل معمل معيّن: الأيام، نسبة الفقد المتوقعة، الكمية المتبقية، هل يحتاج تزويد
function labCounterStatus(labCode,counterCode){
  const counter=DB.counters.find(c=>c.code===counterCode);
  const capacity=counter&&counter.capacity?counter.capacity:0;
  const meta=DB.counterLabMeta[labCode+'|'+counterCode];
  const lossRate=(DB.settings.n2DailyLossPct??3)/100;
  const threshold=DB.settings.n2MinThreshold??10;
  if(counter&&counter.outOfService){
    return{since:meta?meta.since:null,days:0,lossPct:0,remaining:0,needsRefill:false,status:'خارج الخدمة'};
  }
  if(!meta){
    return{since:null,days:0,lossPct:0,remaining:0,needsRefill:true,status:'فارغ'};
  }
  const days=Math.floor((Date.now()-meta.since)/86400000);
  const lossPct=Math.min(100,days*lossRate*100);
  const remaining=Math.max(0,capacity*(1-days*lossRate));
  const needsRefill=remaining<threshold;
  let status;
  if(remaining<=0)status='فارغ';
  else if(needsRefill)status='يحتاج تزويد';
  else if(days<=1)status='ممتلئ';
  else status='جيد';
  return{since:meta.since,days,lossPct,remaining,needsRefill,status};
}

function gb(c,i,b){

  let total=0;

    if(k===bkNoB(c,i)||k.startsWith(prefix)) total+=v;
  });
  return total;
}

function weekDatesOf(dstr){
  const anchor=new Date(dstr+'T00:00:00');

  const diffToSat=(dow+1)%7; // فرق الأيام عن أقرب سبت سابق (بداية الأسبوع)
  const start=new Date(anchor);start.setDate(anchor.getDate()-diffToSat);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);days.push(d);}
  return days;
}

// ===== موسيقى خلفية هادئة بطابع ساكسفون Smooth Jazz (Web Audio API — بدون أي ملفات خارجية) =====
// تبدأ فقط بعد تسجيل الدخول (من شاشة الرئيسية)، مش قبلها
let actx=null,ambientOn=false,ambientNodes=[],ambientMaster=null,saxTimer=null;
function toggleAmbient(){ambientOn?stopAmbient():startAmbient();}
function startAmbient(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const master=actx.createGain();master.gain.setValueAtTime(0.0001,actx.currentTime);
    master.gain.exponentialRampToValueAtTime(0.035,actx.currentTime+2.5); // مستوى منخفض جدًا وغير مزعج
    master.connect(actx.destination);
    ambientMaster=master;
    ambientNodes.push(master);
    // فرش هادئ (باد) تحتي بيدّي إحساس دافئ زي خلفية الجاز الناعم
    const freqs=[130.81,164.81,196.00,261.63];
    freqs.forEach((f,i)=>{
      const osc=actx.createOscillator();osc.type='sine';osc.frequency.value=f;
      const g=actx.createGain();g.gain.value=0.16/(i+1);
      const lfo=actx.createOscillator();lfo.type='sine';lfo.frequency.value=0.06+i*0.012;
      const lfoGain=actx.createGain();lfoGain.gain.value=g.gain.value*0.35;
      lfo.connect(lfoGain);lfoGain.connect(g.gain);
      osc.connect(g);g.connect(master);
      osc.start();lfo.start();
      ambientNodes.push(osc,lfo,g,lfoGain);
    });
    ambientOn=true;
    scheduleSaxNote(2200); // أول نغمة ساكسفون بعد شوية من بدء الباد
  }catch(e){toast('⚠️ تعذّر تشغيل الموسيقى على هذا الجهاز');}
}
function scheduleSaxNote(delay){
  clearTimeout(saxTimer);
  saxTimer=setTimeout(()=>{
    if(!ambientOn)return;
    playSaxNote();
    scheduleSaxNote(3200+Math.random()*3800); // نغمات متباعدة وهادئة زي عزف ساكسفون ناعم في الخلفية
  },delay);
}
function playSaxNote(){
  if(!actx||!ambientMaster)return;
  const scale=[261.63,293.66,329.63,392.00,440.00,523.25,392.00,329.63]; // بنتاتونيك دافئة (Smooth Jazz)
  const freq=scale[Math.floor(Math.random()*scale.length)];
  const t=actx.currentTime;
  const dur=1.6+Math.random()*1.3;
  const osc=actx.createOscillator();osc.type='sawtooth';osc.frequency.setValueAtTime(freq,t);
  const vibrato=actx.createOscillator();vibrato.type='sine';vibrato.frequency.value=4.3;
  const vibGain=actx.createGain();vibGain.gain.value=2.5;
  vibrato.connect(vibGain);vibGain.connect(osc.frequency);
  const filt=actx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=1050;filt.Q.value=0.6;
  const g=actx.createGain();g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.045,t+0.4); // دخول ناعم زي نفس الساكسفون
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(filt);filt.connect(g);g.connect(ambientMaster);
  osc.start(t);vibrato.start(t);
  osc.stop(t+dur+0.15);vibrato.stop(t+dur+0.15);
  ambientNodes.push(osc,vibrato,vibGain,filt,g);
}
function stopAmbient(){
  clearTimeout(saxTimer);
  if(!ambientNodes.length){ambientOn=false;return;}
  const master=ambientMaster;
  try{if(master&&master.gain)master.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.6);}catch(_){}
  const nodesToStop=ambientNodes.slice();
  setTimeout(()=>{nodesToStop.forEach(n=>{try{n.stop&&n.stop();}catch(_){}try{n.disconnect&&n.disconnect();}catch(_){}});},650);
  ambientNodes=[];ambientMaster=null;
  ambientOn=false;
}

function getTabs(){
  const r=S.user.role,all=[{k:'home',ic:'🏠',t:'الرئيسية'}];
  if(r==='data_entry'||r==='admin')all.push({k:'new',ic:'➕',t:'جديد'},{k:'transfer',ic:'🔁',t:'تحويل'});

  return all;
}

// أوردرات/مهام بانتظار إجراء المستخدم الحالي تحديداً (تُستخدم لعداد الجرس ولوحة الإشعارات ولاكتشاف المهام الجديدة)
function myPendingTasks(u,list){
  list=list||DB.orders;
  if(!u||!list)return[];
  switch(u.role){
    case 'accounts':return list.filter(o=>['pending_accounts','return_pending_acc','customer_return_pending_acc'].includes(o.stage));
    case 'cars':return list.filter(o=>o.stage==='pending_cars'||o.stage==='customer_return_pending_cars');
    case 'warehouse':return list.filter(o=>['pending_warehouse','return_pending_wh','customer_return_pending_wh','counter_return_pending_wh'].includes(o.stage));
    case 'rep':return list.filter(o=>['pending_rep','with_rep','return_pending_rep'].includes(o.stage)&&(o.repName===u.name||o.repName===u.username));
    case 'admin':return list.filter(o=>['pending_accounts','pending_cars','pending_warehouse','pending_rep','with_rep','return_pending_rep','return_pending_acc','return_pending_wh','customer_return_pending_acc','customer_return_pending_cars','customer_return_pending_wh','counter_return_pending_wh'].includes(o.stage));
    case 'data_entry':return list.filter(o=>o.cby===u.username&&o.stage==='rejected');
    default:return[];
  }
}
function updateBellBadge(){
  const b=document.getElementById('notifBadge');if(!b)return;
  const n=myPendingTasks(S.user).length;
  if(n>0){b.textContent=n>99?'99+':String(n);b.style.display='block';}
  else{b.style.display='none';}
}
function rNotifPanel(){
  const u=S.user;
  const tasks=myPendingTasks(u).sort((a,b)=>(b.updAt||b.createdAt||0)-(a.updAt||a.createdAt||0)).slice(0,30);
  let permMsg='';
  if(window.Notification){
    if(Notification.permission==='granted')permMsg='<span style="color:var(--ok);font-weight:700;">✓ إشعارات المتصفح مفعّلة</span>';
    else if(Notification.permission==='denied')permMsg='<span style="color:var(--bad);font-weight:700;">⛔ إشعارات المتصفح محظورة — فعّلها من إعدادات المتصفح</span>';
    else permMsg='<span style="color:var(--warn);font-weight:700;">🔔 اضغط هنا لتفعيل إشعارات المتصفح</span>';
  }
  return`<div id="notifPanel" style="position:fixed;top:64px;left:12px;right:12px;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:999;max-height:70vh;overflow:auto;">
    <div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;">
      <b>🔔 مهامك بانتظارك (${tasks.length})</b>
      <button data-a="notifclose" style="background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);">✕</button>
    </div>
    ${permMsg?`<div style="padding:8px 14px;font-size:11px;cursor:${(window.Notification&&Notification.permission==='default')?'pointer':'default'};" ${(window.Notification&&Notification.permission==='default')?'data-a="notifperm"':''}>${permMsg}</div>`:''}
    ${tasks.length===0?'<div style="padding:20px;text-align:center;color:var(--muted);">لا توجد مهام بانتظارك حالياً 🎉</div>':tasks.map(o=>`
      <div data-a="notifitem" data-id="${o.id}" style="padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;">
        <div style="font-weight:800;font-size:13px;">${otitle(o)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px;">${o.cname||''}${o.inv?' · SO: '+o.inv:''}</div>
        <div style="font-size:11px;color:var(--warn);margin-top:3px;font-weight:700;">${stageLabel(o)}</div>
      </div>`).join('')}
  </div>`;}

// تشغيل نغمة تنبيه بسيطة بدون الحاجة لملف صوتي خارجي
function playNotifSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const beep=(freq,delay)=>setTimeout(()=>{
      try{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);
        g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.22);
        o.start();o.stop(ctx.currentTime+.24);
      }catch(_){}

// رسم شريط التتبع (الوركفلو) بطريقة مستقلة عن اتجاه الصفحة (RTL) عشان الخط يوصل صح بين كل نقطة والتانية
function drawTracker(steps,idx,rejIdx){
  const n=steps.length;
  const edge=50/n; // % من الحافة لمركز أول/آخر نقطة
  const span=100-2*edge; // % طول الخط الكامل بين مركزي أول وآخر نقطة
  const frac=n>1?Math.max(0,Math.min(1,idx/(n-1))):0;
  const isRej=rejIdx!=null;
  const progColor=isRej?'var(--bad)':'var(--ok)';
  const progW=isRej?(span*(rejIdx/(n-1))):(span*frac);
  const dots=steps.map((s,i)=>{let c=i<idx?'done':i===idx?'now':'';if(isRej&&i===rejIdx)c='rej';return`<div class="seg ${c}"><div class="dot"></div><div class="tlbl">${s.l}</div></div>`;}).join('');
  return`<div class="tracker">
    <div class="trk-line" style="right:${edge}%;left:${edge}%"></div>
    <div class="trk-prog" style="right:${edge}%;width:${progW}%;background:${progColor}"></div>
    <div class="trk-dots">${dots}</div>
  </div>`;
}

function rTrk(o){
  if(o.kind==='transfer'){
    const steps=[{l:'إدخال'},{l:'حسابات'},{l:'تنفيذ'}];
    const idx=o.stage==='approved'?2:1;
    return drawTracker(steps,idx,o.stage==='rejected'?1:null);
  }
  if(o.kind==='addition'){
    const idx=sidxAdd(o);
    return drawTracker(ADD_STEPS,o.stage==='approved'?ADD_STEPS.length-1:idx,o.stage==='rejected'?1:null);
  }
  if(o.kind==='return'){
    const idx=sidxRet(o);
    return drawTracker(RET_STEPS,o.stage==='returned'?RET_STEPS.length-1:idx,null);
  }
  if(o.kind==='customer_return'){
    const idx=sidxCret(o);
    return drawTracker(CRET_STEPS,o.stage==='customer_returned'?CRET_STEPS.length-1:idx,null);
  }
  const idx=sidxWd(o);
  return drawTracker(WD_STEPS,idx,o.stage==='rejected'?1:null);
}

async function onConsume(e){

  if(!labCode){toast('⛔ اختاري المعمل');return;}
  const lab=DB.labs.find(l=>l.code===labCode);
  if(!lab||!labCodes(lab).includes(cc)){toast('⛔ هذا المعمل غير تابع لهذا العميل');return;}
  const bal=glb(labCode,cc,ic,batch);
  if(bal<=0){toast('⛔ لا يوجد رصيد لهذا الصنف/الباتش بهذا المعمل');return;}
  if(qty>bal){toast(`⛔ الكمية (${qty}) أكبر من الرصيد المتاح بالمعمل (${bal})`);return;}
  const k=lbk(labCode,cc,ic,batch);
  DB.labBalances[k]=bal-qty;
  if(DB.labBalances[k]===0)delete DB.labBalances[k];
  await svlb();
  const o={id:uid('cs'),kind:'consumption',stage:'done',cby:u.username,cbyn:u.name,createdAt:Date.now(),updAt:Date.now(),

  DB.orders.push(o);await svo();
  toast(`✅ تم تسجيل استهلاك ${qty} وخصمها من رصيد المعمل`);e.target.reset();render();
}

    const cur=sel.value;
    const hist=additionBatchHistory(cc,ic);
    sel.innerHTML=`<option value="__new__">➕ تشغيلة جديدة</option>`+hist.map(b=>`<option value="${b}" ${b===cur?'selected':''}>📦 ${b} (تشغيلة سابقة لهذا الصنف)</option>`).join('');
    if(!hist.includes(cur))sel.value='__new__';
    toggle();
  };
  const toggle=()=>{
    const isNew=sel.value==='__new__';
    oth.style.display=isNew?'block':'none';
    oth.required=isNew;
    if(!isNew)oth.value='';
  };
  sel.addEventListener('change',toggle);
  ['acc','aic'].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener('change',refresh);});
  refresh();
}

function inRng(o,r){
  const now=new Date(),d=new Date(o.createdAt||Date.now());
  if(r==='today')return d.toDateString()===now.toDateString();
  if(r==='week')return d>=new Date(now-7*864e5);
  if(r==='month')return d>=new Date(now-30*864e5);
  return true;
}

      <div class="field"><label>حالة البضاعة/الكونتر</label><select id="qcs">${qcOpts.map(x=>`<option value="${x}" ${o.qcStatus===x?'selected':''}>${x||'— اختر —'}</option>`).join('')}</select></div>

      <button class="bs" data-a="qc" data-id="${o.id}" style="background:#8A6D1E;color:#fff;width:100%;">💾 حفظ ملاحظة الجودة</button>
      `:`<div style="font-size:11.5px;color:var(--muted);">قسم إدارة الجودة فقط هو المخوّل بتسجيل أو تعديل هذه الحالة.</div>`}
    </div>
    <button class="bs bghost" style="width:100%;margin-top:4px;" data-a="back">⟵ رجوع</button>

function rLabCounters(){
  const q=(S.labCntSrch||'').trim().toLowerCase();
  let rows=Object.keys(DB.counterLabMeta).map(key=>{
    const[labCode,counterCode]=key.split('|');
    const lab=DB.labs.find(l=>l.code===labCode);
    const counter=DB.counters.find(c=>c.code===counterCode);
    if(!lab||!counter)return null;
    const st=labCounterStatus(labCode,counterCode);
    return{labCode,counterCode,lab,counter,...st};
  }).filter(Boolean);
  if(q){
    rows=rows.filter(r=>r.lab.name.toLowerCase().includes(q)||r.counterCode.toLowerCase().includes(q)||labCustNames(r.lab).toLowerCase().includes(q)||r.status.toLowerCase().includes(q)||(r.needsRefill?'نعم':'لا').includes(q));
  }
  rows.sort((a,b)=>(b.since||0)-(a.since||0));
  const stColor=s=>s==='ممتلئ'?'var(--ok)':s==='جيد'?'var(--blue2)':s==='يحتاج تزويد'?'var(--warn)':s==='خارج الخدمة'?'var(--muted)':'var(--bad)';
  return`
  <div class="stitle">📡 متابعة الكونترات داخل المعامل</div>
  <div class="ssub">${rows.length} كونتر موجود حالياً بالمعامل</div>
  <div class="content">
    <div class="field"><input id="lcsi" placeholder="🔎 بحث باسم المعمل أو رقم الكونتر أو الحالة أو يحتاج تزويد (نعم/لا)..." value="${q.replace(/"/g,'&quot;')}"></div>
    <div class="brow" style="margin-bottom:8px;">
      <button class="bs bgo" data-a="xlslabcnt" type="button" style="width:100%;">📥 تصدير تقرير Excel</button>
    </div>
    ${S.user.role==='admin'?`
    <div class="card" style="background:var(--blue-lg);border-color:var(--blue2);">
      <div style="font-weight:800;font-size:12px;margin-bottom:6px;">⚙️ إعدادات الحساب التلقائي</div>
      <div class="row2">
        <div class="field"><label>معدل الفقد اليومي (%)</label><input id="lossPctSet" type="number" min="0" step="0.1" value="${DB.settings.n2DailyLossPct??3}"></div>
        <div class="field"><label>الحد الأدنى قبل التزويد (لتر)</label><input id="minThreshSet" type="number" min="0" step="0.5" value="${DB.settings.n2MinThreshold??10}"></div>
      </div>
      <button class="bs bgo" data-a="savesettings" type="button" style="width:100%;">💾 حفظ الإعدادات</button>
    </div>`:''}
    ${rows.length===0?`<div class="empty"><div class="ic">📡</div><div class="t">لا توجد كونترات بالمعامل حالياً</div></div>`:
    `<div style="overflow-x:auto;"><table class="rep">
      <thead><tr>
        <th>الكونتر</th><th>المعمل</th><th>تاريخ التسليم</th><th>الأيام</th><th>الفقد المتوقع %</th><th>المتبقي (لتر)</th><th>يحتاج تزويد</th><th>الحالة</th>
      </tr></thead>
      <tbody>${rows.map(r=>`<tr style="cursor:pointer;" data-a="cntlog" data-cnt="${r.counterCode}">
        <td>🎫 ${r.counterCode}</td>
        <td>🏭 ${r.lab.name}</td>
        <td>${r.since?new Date(r.since).toLocaleDateString('ar-EG'):'-'}</td>
        <td>${r.days}</td>
        <td>${r.lossPct.toFixed(0)}%</td>
        <td style="font-weight:800;">${r.remaining.toFixed(1)}</td>
        <td style="color:${r.needsRefill?'var(--bad)':'var(--ok)'};font-weight:800;">${r.needsRefill?'نعم':'لا'}</td>
        <td style="color:${stColor(r.status)};font-weight:800;">${r.status}</td>
      </tr>`).join('')}</tbody>
    </table></div>`}
    ${S.user.role==='admin'?`<button class="bs bghost" style="width:100%;margin-top:12px;" data-a="toggleoos" type="button">🚫 تعليم كونتر "خارج الخدمة" / إلغاء</button>`:''}
  </div>`;}

function rCntLog(){
  const code=S.cntLogCode;
  const counter=DB.counters.find(c=>c.code===code);
  const q=(S.cntLogSrch||'').trim();
  let entries=DB.counterLog.filter(l=>l.counterCode===code).sort((a,b)=>(b.at||0)-(a.at||0));
  if(q){
    entries=entries.filter(l=>{
      const d1=new Date(l.at||0).toLocaleDateString('ar-EG');
      const d2=new Date(l.at||0).toLocaleDateString('en-GB');
      return d1.includes(q)||d2.includes(q)||(l.reason||'').includes(q)||(l.byName||'').includes(q);
    });
  }
  return`
  <div class="stitle">🎫 تقرير حركة الكونتر ${code}</div>
  <div class="ssub">${counter?`${counter.name||''} · ${ccap(code)} · الحالة: ${counter.status==='ممتلئ'?'🟢 ممتلئ':'🔴 فارغ'}`:''} — ${entries.length} حركة</div>
  <div class="content">
    <div class="field"><input id="clsi" placeholder="🔎 بحث بالتاريخ أو نوع الحركة أو اسم المستخدم..." value="${q.replace(/"/g,'&quot;')}"></div>
    ${entries.length===0?`<div class="empty"><div class="ic">📭</div><div class="t">لا توجد حركات مسجّلة لهذا الكونتر بعد</div></div>`:
    entries.map(l=>`<div class="card">
      <div class="ch"><div class="ctitle">${l.reason}</div><span class="tag tt">${new Date(l.at||0).toLocaleDateString('ar-EG')}</span></div>
      <div class="kv"><span>الوقت</span><b>${new Date(l.at||0).toLocaleTimeString('ar-EG')}</b></div>
      ${l.qty?`<div class="kv"><span>الكمية</span><b>${l.qty}</b></div>`:''}
      ${l.n2?`<div class="kv"><span>نتروجين (لتر)</span><b>${l.n2}</b></div>`:''}
      ${l.locFrom?`<div class="kv"><span>من</span><b>${l.locFrom}</b></div>`:''}
      ${l.locTo?`<div class="kv"><span>إلى</span><b>${l.locTo}</b></div>`:''}
      <div class="kv"><span>بواسطة</span><b>${l.byName||l.by||'-'}</b></div>
      ${l.note?`<div class="kv"><span>ملحوظة</span><b style="font-size:11px;">${l.note}</b></div>`:''}
    </div>`).join('')}
    <button class="bs bghost" style="width:100%;margin-top:6px;" data-a="tab" data-tab="adm">⟵ رجوع للإدارة</button>
  </div>`;}

function sameDay(ts,d){const a=new Date(ts||0);return a.getFullYear()===d.getFullYear()&&a.getMonth()===d.getMonth()&&a.getDate()===d.getDate();}

function bind(){
  document.querySelectorAll('[data-a]').forEach(el=>el.addEventListener('click',onA));
  const f=(id,fn)=>{
    const e=document.getElementById(id);if(!e)return;
    e.addEventListener('submit',async(ev)=>{
      ev.preventDefault();
      if(_actionLock)return;
      _actionLock=true;
      const btn=e.querySelector('button[type="submit"]');
      const origLabel=btn?btn.textContent:'';
      if(btn){btn.disabled=true;btn.textContent='⏳ جارِ التنفيذ...';btn.style.opacity='.65';}
      try{ await fn(ev); }
      finally{
        _actionLock=false;
        if(btn){btn.disabled=false;btn.textContent=origLabel;btn.style.opacity='1';}
      }
    });
  };
  f('sif',onSI);f('nf',onNew);f('trf',onTrf);f('carf',onCars);f('auf',onAU);f('acf',onAC);f('aif',onAI);f('asf',onAS);f('alf',onAL);f('acnf',onACN);f('cnsf',onConsume);f('n2f',onN2Fill);f('acarf',onACar);f('euf',onEU);
  const rnSelEl=document.getElementById('rnSel');
  if(rnSelEl)rnSelEl.addEventListener('change',()=>{const ot=document.getElementById('rnOther');if(ot)ot.style.display=rnSelEl.value==='__other__'?'block':'none';});
  const cnSelEl=document.getElementById('cnSel');
  if(cnSelEl)cnSelEl.addEventListener('change',()=>{const ot=document.getElementById('cnOther');if(ot)ot.style.display=cnSelEl.value==='__other__'?'block':'none';});
  const n2cntEl=document.getElementById('n2cnt');if(n2cntEl)n2cntEl.addEventListener('change',()=>updateN2LabOptions(n2cntEl.value));
  f('crf',onCounterReturn);
  const crlabEl=document.getElementById('crlab');if(crlabEl)crlabEl.addEventListener('change',()=>updateCRCounterOptions(crlabEl.value));
  lkSel('ccc','ccn','c');lkSel('cic','cin','i');
  cbbl();
  lkSel('acc','acn','c');lkSel('aic','ain','i','aisec','aisecval');
  abbl();
  lkSel('scc','scn','c');lkSel('sic','sin','i','sisec','sisecval');
  lkSel('tcc','tcn','c');lkSel('tic','tin','i');
  bbl();tbbl();bsi();bhsi();bclsi();blcsi();checkInvDup();
  const af=document.getElementById('atf');if(af)af.addEventListener('change',onAtt);
  const upf=document.getElementById('upf');if(upf)upf.addEventListener('change',onUPhoto);
  const aurole=document.getElementById('aurole');
  if(aurole){
    const wrap=document.getElementById('ausecwrap');
    const toggleSec=()=>{if(wrap)wrap.style.display=(aurole.value==='data_entry'||aurole.value==='accounts')?'':'none';};
    aurole.addEventListener('change',toggleSec);toggleSec();
  }
  document.querySelectorAll('[id^="eurole_"]').forEach(sel=>{
    const un=sel.id.replace('eurole_','');
    const wrap=document.getElementById('eusecwrap_'+un);
    if(!wrap)return;
    const toggleSec=()=>{wrap.style.display=(sel.value==='data_entry'||sel.value==='accounts')?'':'none';};
    sel.addEventListener('change',toggleSec);
  });
  const cpf=document.getElementById('cpf');if(cpf)cpf.addEventListener('change',onCarPhoto);
}

function bbl(){
  const box=document.getElementById('balbx');if(!box)return;
  const u=S.user;
  const upd=()=>{
    const cc=(document.getElementById('scc')||{}).value?.trim();
    const ic=(document.getElementById('sic')||{}).value?.trim();
    const batchEl=document.getElementById('sbatch');
    if(batchEl&&batchEl.tagName==='SELECT'){
      const cur=batchEl.value;
      if(!cc||!ic){batchEl.innerHTML=`<option value="">اختر العميل والصنف أولاً...</option>`;}
      else{
        const batches=centralBatchList(cc,ic);
        if(!batches.length){batchEl.innerHTML=`<option value="">لا يوجد رصيد/تشغيلات متاحة لهذا الصنف</option>`;}
        else{batchEl.innerHTML=`<option value="">اختر التشغيلة...</option>`+batches.map(b=>`<option value="${b.batch}" ${b.batch===cur?'selected':''}>📦 ${b.batch} — رصيد: ${b.qty}</option>`).join('');}
      }
    }
    const bv=(batchEl||{}).value?.trim()||'';
    const qty=+(document.getElementById('sqty')||{}).value||0;
    updateLabOptions(cc);
    // إظهار/إخفاء حقول الكونتر تلقائيًا: تظهر بس لو الصنف المختار محدد عليه إنه يحتاج كونتر
    const cntField=document.getElementById('scntfield'),cntWrap2=document.getElementById('scntwrap2');
    const needsC=itemNeedsCounter(ic);
    if(cntField)cntField.style.display=needsC?'':'none';
    if(cntWrap2)cntWrap2.style.display=needsC?'':'none';
    if(!needsC){const cSel=document.getElementById('scounter');if(cSel)cSel.value='';}
    if(!cc||!ic){box.textContent='أدخل كود العميل والصنف لعرض الرصيد المتاح حالياً';box.className='balbox';return;}
    if(u.role==='data_entry'){
      const hasAdded=DB.orders.some(o=>o.kind==='addition'&&o.cby===u.username&&o.ccode===cc&&o.icode===ic&&o.stage!=='rejected');
      if(!hasAdded){box.innerHTML='⛔ <b>غير مسموح</b> — لا يمكنك الصرف لعميل لم تسجّل له إضافة بنفسك';box.className='balbox balbad';return;}
    }
    const totalBal=gb(cc,ic);
    const batchBal=bv?gb(cc,ic,bv):null;
    let msg='';
    if(bv&&batchBal!==null){
      msg=`رصيد الباتش <b>${bv}</b>: <b style="color:${batchBal>0?'var(--ok)':'var(--bad)'}">${batchBal}</b> | إجمالي الصنف: <b>${totalBal}</b>`;
      if(batchBal<=0){box.className='balbox balbad';}
      else if(qty>0&&qty>batchBal){box.className='balbox balbad';}
      else{box.className='balbox balok';}
    } else {
      const after=qty>0?totalBal-qty:null;
      msg=`إجمالي الرصيد المتاح: <b>${totalBal}</b>${after!==null?` · بعد الصرف: <b style="color:${after<0?'var(--bad)':'var(--ok)'}">${after}</b>`:''}`;
      box.className='balbox '+(totalBal<=0?'balbad':after!==null&&after<0?'balbad':'balok');
    }
    box.innerHTML=msg;
  };
  ['scc','sic','sqty'].forEach(id=>{const e=document.getElementById(id);if(e){e.addEventListener('input',upd);e.addEventListener('change',upd);}});
  const batchEl0=document.getElementById('sbatch');if(batchEl0)batchEl0.addEventListener('change',upd);
  upd();
}

function tbbl(){
  const box=document.getElementById('tbalbx');if(!box)return;
  const cbox=document.getElementById('tcntbx');
  const upd=()=>{
    const cc=(document.getElementById('tcc')||{}).value?.trim();
    const ic=(document.getElementById('tic')||{}).value?.trim();
    const flab=(document.getElementById('tflab')||{}).value?.trim();
    const batchEl=document.getElementById('tbatch');
    if(batchEl){
      const cur=batchEl.value;
      if(!flab||!ic){batchEl.innerHTML=`<option value="">اختر المعمل المصدر والصنف أولاً...</option>`;}
      else{
        const batches=labBatchList(flab,cc,ic);
        if(!batches.length){batchEl.innerHTML=`<option value="">لا توجد تشغيلات متاحة بالمعمل المصدر لهذا الصنف</option>`;}
        else{batchEl.innerHTML=`<option value="">اختر التشغيلة...</option>`+batches.map(b=>`<option value="${b.batch}" ${b.batch===cur?'selected':''}>📦 ${b.batch} — رصيد: ${b.qty}</option>`).join('');}
      }
    }
    const bv=(batchEl||{}).value?.trim()||'';
    const qty=+(document.getElementById('tqty')||{}).value||0;
    updateLabPickers(cc);
    if(!cc||!flab||!ic||!bv){box.textContent='اكتب كود العميل والمعمل المصدر والصنف والباتش لعرض الرصيد المتاح داخل المعمل';box.className='balbox';}
    else{
      const labBal=glb(flab,cc,ic,bv);
      let msg=`رصيد الباتش <b>${bv}</b> داخل المعمل المصدر: <b style="color:${labBal>0?'var(--ok)':'var(--bad)'}">${labBal}</b>`;
      if(labBal<=0){box.className='balbox balbad';}
      else if(qty>0&&qty>labBal){box.className='balbox balbad';msg+=' — الكمية أكبر من المتاح';}
      else{box.className='balbox balok';}
      box.innerHTML=msg;
    }
    // رصيد الكونتر المختار داخل المعمل المصدر
    if(cbox){
      const cnt=(document.getElementById('tcnt')||{}).value;
      const cqty=+(document.getElementById('tcqty')||{}).value||0;
      if(!flab||!cnt){cbox.style.display='none';}
      else{
        const cBal=cbal(flab,cnt);
        cbox.style.display='block';
        cbox.innerHTML=`رصيد الكونتر <b>${cnname(cnt)}</b> داخل المعمل المصدر: <b style="color:${cBal>0?'var(--ok)':'var(--bad)'}">${cBal}</b>`;
        cbox.className='balbox '+(cBal<=0?'balbad':(cqty>0&&cqty>cBal?'balbad':'balok'));
      }
    }
  };
  ['tcc','tflab','ttlab','tic','tqty','tbatch','tcnt','tcqty'].forEach(id=>{const e=document.getElementById(id);if(e){e.addEventListener('input',upd);e.addEventListener('change',upd);}});
  upd();
}

function checkInvDup(){
  const el=document.getElementById('ainv'),chk=document.getElementById('ainvchk');
  if(!el||!chk)return;
  el.addEventListener('input',()=>{
    const v=el.value.trim();
    if(!v){chk.textContent='';chk.classList.remove('miss');return;}
    const dup=DB.orders.some(o=>o.kind==='addition'&&o.stage!=='rejected'&&(o.inv||'').trim().toLowerCase()===v.toLowerCase());
    if(dup){chk.textContent='⛔ رقم الأمر ده مُستخدم من قبل';chk.classList.add('miss');}
    else{chk.textContent='✓ رقم متاح';chk.classList.remove('miss');}
  });
}

async function onAtt(e){

  if(file.size>2*1024*1024){toast('الملف أكبر من 2MB');return;}
  const r=new FileReader();
  r.onload=ev=>{pendAtt={data:ev.target.result,name:file.name,type:file.type};const p=document.getElementById('atp');if(p)p.innerHTML=`<div class="attachprev">✅ ${file.name}</div>`;};

async function onNew(e){
  e.preventDefault();const f=new FormData(e.target),u=S.user,kind=S.ntype;
  const cc=f.get('cc')?.trim(),ic=f.get('ic')?.trim(),qty=+f.get('qty');
  const sector=(f.get('sector')||'').trim();
  const itFound=fi(ic);
  if(itFound&&!itFound.sector){toast('⚠️ هذا الصنف غير مرتبط بقطاع — الرجاء إبلاغ الإدارة لتحديد قطاعه أولاً');return;}
  if(itFound&&!sector){toast('⛔ الرجاء اختيار/تأكيد كود الصنف حتى يظهر القطاع تلقائياً');return;}
  let batchVal=f.get('batch');
  if(kind==='addition'){
    const inv=(f.get('inv')||'').trim();
    const dup=DB.orders.some(o=>o.kind==='addition'&&o.stage!=='rejected'&&(o.inv||'').trim().toLowerCase()===inv.toLowerCase());
    if(dup){toast(`⛔ رقم الأمر "${inv}" مُستخدم من قبل — لا يمكن تكراره`);return;}
    const bSel=f.get('batchSel');
    batchVal=bSel==='__new__'?(f.get('batchOther')||'').trim():bSel;
    if(!batchVal){toast('⛔ الرجاء إدخال أو اختيار رقم التشغيلة');return;}
  }
  const orderType=kind==='withdrawal'?(f.get('orderType')||'amanah'):'';
  if(kind==='withdrawal'&&orderType==='amanah'){
    // تحقق: مدخل البيانات لا يصرف لعميل لم يضفه هو (بس لصرف الأمانة اللي بيخصم من رصيد حقيقي)
    if(u.role==='data_entry'){
      const hasAdded=DB.orders.some(o=>o.kind==='addition'&&o.cby===u.username&&o.ccode===cc&&o.icode===ic&&o.stage!=='rejected');
      if(!hasAdded){toast('⛔ لا يمكنك الصرف لعميل لم تسجّل له إضافة بنفسك');return;}
    }
    const batchVal=(f.get('batch')||'').trim();
    const bal=gb(cc,ic,batchVal);
    if(bal<=0){
      const totalBal=gb(cc,ic);
      if(totalBal<=0){toast('⛔ لا يوجد رصيد متاح لهذا العميل من هذا الصنف');return;}
      else{toast(`⛔ لا يوجد رصيد للباتش "${batchVal}" — الرصيد الإجمالي ${totalBal}`);return;}
    }
    if(qty>bal){toast(`⛔ الكمية (${qty}) أكبر من الرصيد المتاح للباتش (${bal})`);return;}
  }
  const labCode=(f.get('labCode')||'').trim();
  const counterCode=(f.get('counterCode')||'').trim();
  const counterWithGoods=(f.get('counterWithGoods')||'yes')==='yes';
  const counterQty=+(f.get('counterQty')||1);
  if(kind==='withdrawal'&&orderType==='amanah'&&!labCode){toast('⛔ الرجاء اختيار معمل العميل (لازم يكون مسجّل للعميل ده من الإدارة أولاً)');return;}
  if(kind==='withdrawal'&&orderType==='amanah'&&labCode&&!labsForCustomer(cc).some(l=>l.code===labCode)){toast('⛔ هذا المعمل غير تابع لهذا العميل');return;}
  if(kind==='withdrawal'&&orderType==='amanah'&&counterCode){
    const counter=DB.counters.find(x=>x.code===counterCode);
    if(counter&&counter.owner&&counter.owner!==u.username&&u.role!=='admin'){
      toast(`⛔ الكونتر ده مسؤوليّة ${u2n(counter.owner)} فقط — لا يمكنك صرفه`);return;
    }
  }
  const o={id:uid('o'),kind,stage:'pending_accounts',cby:u.username,cbyn:u.name,createdAt:Date.now(),updAt:Date.now(),
    schedDate:(f.get('schedDate')||'').trim()||ymd(Date.now()),
    inv:f.get('inv')||'',ccode:cc,cname:f.get('cn'),icode:ic,iname:f.get('iname'),
    batch:batchVal,expiry:f.get('expiry'),qty,note:f.get('note')||'',
    orderType,
    labCode:orderType==='amanah'?labCode:'',labName:orderType==='amanah'?lname(labCode):'',
    counterCode:orderType==='amanah'?counterCode:'',counterName:(orderType==='amanah'&&counterCode)?cnname(counterCode):'',
    counterWithGoods,counterQty,
    sector,sectorName:sname(sector)};
  if(pendAtt)o.att=pendAtt;
  // *** الرصيد لا يُضاف هنا — يُضاف فقط عندما يؤكد المخزن استلام البضاعة (ولا يُضاف نهائياً للأوردر العادي) ***
  DB.orders.push(o);await svo();pendAtt=null;
  anim('جارِ الإرسال إلى حسابات العملاء',()=>{S.tab='home';S.oid=null;});
}

async function onTrf(e){
  e.preventDefault();const f=new FormData(e.target),u=S.user;
  const cc=f.get('cc')?.trim(),flab=f.get('flab')?.trim(),tlab=f.get('tlab')?.trim();
  const ic=f.get('ic')?.trim(),batch=f.get('batch')?.trim(),qty=+f.get('qty')||0;
  const counterCode=f.get('counterCode')?.trim(),counterQty=+f.get('counterQty')||0;
  if(!flab||!tlab){toast('⛔ الرجاء اختيار المعمل المصدر والمعمل المُحوَّل إليه');return;}
  if(flab===tlab){toast('⛔ لا يمكن التحويل لنفس المعمل');return;}
  const labF=DB.labs.find(l=>l.code===flab),labT=DB.labs.find(l=>l.code===tlab);
  if(!labF||!labT||!labCodes(labF).includes(cc)||!labCodes(labT).includes(cc)){toast('⛔ المعملين لازم يكونوا الاتنين تابعين لنفس العميل');return;}
  const wantsGoods = ic && batch && qty>0;
  const wantsCounter = counterCode && counterQty>0;
  if(!wantsGoods && !wantsCounter){toast('⛔ حدّدي بضاعة و/أو كونتر تحويهم');return;}
  if(wantsCounter){
    const counter=DB.counters.find(c=>c.code===counterCode);
    if(!counter){toast('⛔ كود الكونتر غير موجود');return;}
    if(counter.owner&&counter.owner!==u.username&&u.role!=='admin'){
      toast(`⛔ الكونتر ده مسؤوليّة ${u2n(counter.owner)} فقط — لا يمكنك تحويله`);return;
    }
    const cAvail=cbal(flab,counterCode);
    if(cAvail<=0){toast('⛔ لا يوجد رصيد لهذا الكونتر داخل المعمل المصدر');return;}
    if(cAvail<counterQty){toast(`⛔ رصيد الكونتر بالمعمل المصدر (${cAvail}) أقل من الكمية المطلوبة`);return;}
  }
  if(wantsGoods){
    const avail=glb(flab,cc,ic,batch);
    if(avail<=0){toast('⛔ لا يوجد رصيد لهذا الصنف/الباتش داخل المعمل المصدر');return;}
    if(avail<qty){toast(`⛔ الرصيد المتاح داخل المعمل المصدر (${avail}) أقل من الكمية المطلوب تحويلها`);return;}
  }
  if(wantsGoods){
    const kF=lbk(flab,cc,ic,batch),kT=lbk(tlab,cc,ic,batch);
    DB.labBalances[kF]=(DB.labBalances[kF]||0)-qty;
    if(DB.labBalances[kF]===0)delete DB.labBalances[kF];
    DB.labBalances[kT]=(DB.labBalances[kT]||0)+qty;
    await svlb();
  }
  if(wantsCounter){
    DB.counterBalances[flab+'|'+counterCode]=(DB.counterBalances[flab+'|'+counterCode]||0)-counterQty;
    if(DB.counterBalances[flab+'|'+counterCode]===0)delete DB.counterBalances[flab+'|'+counterCode];
    DB.counterBalances[tlab+'|'+counterCode]=(DB.counterBalances[tlab+'|'+counterCode]||0)+counterQty;
    await svcb();
    delete DB.counterLabMeta[flab+'|'+counterCode];
    DB.counterLabMeta[tlab+'|'+counterCode]={since:Date.now(),deliveredAt:Date.now()};
    await svclm();
    await logCounterMove(counterCode,'تحويل بين معامل',counterQty,labF.name,labT.name,0,'');
  }
  const o={id:uid('lt'),kind:'lab_transfer',stage:'done',cby:u.username,cbyn:u.name,createdAt:Date.now(),updAt:Date.now(),
    schedDate:(f.get('schedDate')||'').trim()||ymd(Date.now()),
    ccode:cc,cname:f.get('cn'),flabCode:flab,flabName:labF.name,tlabCode:tlab,tlabName:labT.name,
    icode:wantsGoods?ic:'',iname:wantsGoods?f.get('iname'):'',batch:wantsGoods?batch:'',qty:wantsGoods?qty:0,
    counterCode:wantsCounter?counterCode:'',counterName:wantsCounter?cnname(counterCode):'',counterQty:wantsCounter?counterQty:0,
    note:f.get('note')};
  DB.orders.push(o);await svo();
  const parts=[];
  if(wantsGoods)parts.push(`${qty} من البضاعة`);
  if(wantsCounter)parts.push(`${counterQty} كونتر`);
  toast(`✅ تم تحويل ${parts.join(' و')} فوراً من ${labF.name} إلى ${labT.name}`);e.target.reset();S.tab='home';render();
}

async function doAppr(id){
  const o=DB.orders.find(x=>x.id===id);if(!o)return;
  if(o.kind==='transfer'){
    const avail=gb(o.fcc,o.icode,o.batch);
    if(avail<+o.qty){toast(`⛔ لا يمكن تنفيذ التحويل — الرصيد الحالي في الباتش (${avail}) أقل من الكمية`);return;}
    DB.balances[bk(o.fcc,o.icode,o.batch)]=(DB.balances[bk(o.fcc,o.icode,o.batch)]||0)-(+o.qty);
    DB.balances[bk(o.tcc,o.icode,o.batch)]=(DB.balances[bk(o.tcc,o.icode,o.batch)]||0)+(+o.qty);
    o.stage='approved';
    o.updAt=Date.now();await svo();
    toast('✅ تم تنفيذ التحويل وتحديث الأرصدة');S.tab='home';S.oid=null;render();
    return;
  }
  if(o.kind==='return'&&o.stage==='return_pending_acc'){
    // مرتجع كمية لم تُسلَّم من فاتورة صرف جزئي: بعد موافقة الحسابات → المخازن للتأكيد النهائي وإضافة الرصيد
    o.stage='return_pending_wh';o.updAt=Date.now();await svo();
    anim('تمت الموافقة — جارِ الإرسال للمخازن للتأكيد',()=>{S.tab='home';S.oid=null;});
    return;
  }
  if(o.kind==='customer_return'&&o.stage==='customer_return_pending_acc'){
    // سحب بضاعة من عميل بطلب من مدخل البيانات: بعد موافقة الحسابات → السيارات
    o.stage='customer_return_pending_cars';o.updAt=Date.now();await svo();
    anim('تمت الموافقة — جارِ الإرسال لقسم السيارات',()=>{S.tab='home';S.oid=null;});
    return;
  }
  if(o.kind==='addition'){
    // الإضافة: بعد موافقة الحسابات تذهب مباشرة للمخازن (بدون سيارات أو مندوب)
    o.stage='pending_warehouse';
    o.updAt=Date.now();await svo();
    anim('تمت الموافقة — جارِ الإرسال للمخازن',()=>{S.tab='home';S.oid=null;});
  } else {
    // الصرف: بعد موافقة الحسابات يذهب للسيارات كالمعتاد
    o.stage='pending_cars';
    o.updAt=Date.now();await svo();
    anim('تمت الموافقة — جارِ الإرسال لقسم السيارات',()=>{S.tab='home';S.oid=null;});
  }
}

async function doWH(id){
  const o=DB.orders.find(x=>x.id===id);if(!o)return;
  // تأكيد نهائي لاستلام مرتجع من تسليم جزئي → إضافة الرصيد (الكمية كانت لم تصل للعميل أصلاً) — لا يُضاف رصيد أمانة للأوردر العادي (SMS) لأنه أصلاً لا يمس رصيد الأمانة
  if(o.stage==='return_pending_wh'){
    if(o.balAdded){toast('⚠️ تمت إضافة هذا الرصيد مسبقاً');return;}
    if(o.orderType!=='regular'){
      const k=bk(o.ccode,o.icode,o.batch);
      DB.balances[k]=(DB.balances[k]||0)+(+o.qty);
    }
    o.balAdded=true;
    o.stage='returned';
    o.updAt=Date.now();await svo();
    anim(o.orderType==='regular'?'✅ تم تأكيد استلام مرتجع الأوردر العادي بالمخزن':'✅ تم تأكيد الاستلام بالمخزن وإضافة الرصيد للعميل',()=>{S.tab='home';S.oid=null;});
    return;
  }
  // تأكيد نهائي لسحوبات (سحب بضاعة من رصيد العميل) → خصم الرصيد من المصدر، ولو كانت من معمل فالبضاعة بترجع فعلياً لأمانة المخزن
  if(o.stage==='customer_return_pending_wh'){
    if(o.balAdded){toast('⚠️ تم تنفيذ هذا السحب مسبقاً');return;}
    const fromLab = o.sourcePool==='lab';
    const k = fromLab ? lbk(o.labCode,o.ccode,o.icode,o.batch) : bk(o.ccode,o.icode,o.batch);
    const pool = fromLab ? DB.labBalances : DB.balances;
    const cur=pool[k]||0;
    if(cur<+o.qty){toast(`⛔ الرصيد الحالي (${cur}) أقل من كمية السحب (${o.qty}) — لا يمكن التنفيذ`);return;}
    pool[k]=cur-(+o.qty);
    if(pool[k]===0)delete pool[k];
    if(fromLab){
      // البضاعة راجعة فعلياً بالمخزن → تضاف لأمانة المخزن الخاصة بنفس العميل
      const wk=bk(o.ccode,o.icode,o.batch);
      DB.balances[wk]=(DB.balances[wk]||0)+(+o.qty);
    }
    o.balAdded=true;
    o.stage='customer_returned';
    o.updAt=Date.now();await svo();if(fromLab)await svlb();
    anim(fromLab?'✅ تم استلام السحوبات وإرجاعها لأمانة المخزن':'✅ تم تأكيد استلام السحوبات بالمخزن وخصم الرصيد',()=>{S.tab='home';S.oid=null;});
    return;
  }
  // تأكيد استلام كونتر راجع من معمل العميل → يزيد رصيد الكونتر بالمخزن
  if(o.stage==='counter_return_pending_wh'){
    if(o.balAdded){toast('⚠️ تم تأكيد استلام هذا الكونتر مسبقاً');return;}
    DB.counterBalances['WH|'+o.counterCode]=(DB.counterBalances['WH|'+o.counterCode]||0)+(+o.qty);
    const counterObj=DB.counters.find(c=>c.code===o.counterCode);
    if(counterObj){counterObj.status='فارغ';}
    o.balAdded=true;
    o.stage='counter_returned';
    o.updAt=Date.now();await svo();await svcb();await svco();
    await logCounterMove(o.counterCode,'رجوع للمخزن (تأكيد)',o.qty,'في الطريق','المخزن',0,'');
    anim('✅ تم تأكيد استلام الكونتر بالمخزن',()=>{S.tab='home';S.oid=null;});
    return;
  }
  if(o.kind==='addition'){
    if(o.balAdded){toast('⚠️ تم إضافة هذا الرصيد مسبقاً');return;}
    const k=bk(o.ccode,o.icode,o.batch);
    DB.balances[k]=(DB.balances[k]||0)+(+o.qty);
    o.balAdded=true;
    o.stage='approved';o.updAt=Date.now();await svo();
    anim('✅ تم الاستلام بالمخزن وإضافة الرصيد للعميل',()=>{S.tab='home';S.oid=null;});
  } else {
    o.stage='pending_rep';o.updAt=Date.now();await svo();
    anim('جارِ الإرسال للمندوب',()=>{S.tab='home';S.oid=null;});
  }
}

async function doRDlv(id){
  const o=DB.orders.find(x=>x.id===id);if(!o)return;
  if(o.balDeducted){toast('⚠️ تم خصم هذا الطلب مسبقاً');return;}
  // الكمية المُسلَّمة فعلياً
  const dlvEl=document.getElementById('dlvQty_'+id);
  const dlvQty=dlvEl?Math.min(+dlvEl.value||+o.qty,+o.qty):+o.qty;
  const retQty=(+o.qty)-dlvQty;

  const finish=async(loc)=>{
    o.stage='delivered';o.updAt=Date.now();
    o.dlvQty=dlvQty;
    o.retQty=retQty;
    o.dloc=loc||null;
    if(o.kind==='withdrawal'&&o.orderType!=='regular'){
      const k=bk(o.ccode,o.icode,o.batch);
      DB.balances[k]=(DB.balances[k]||0)-(+o.qty);
      o.balDeducted=true;
      // البضاعة اللي فعلاً وصلت للعميل تدخل رصيد معمله (مش رصيد المخزن)
      if(o.labCode&&dlvQty>0){
        const lk_=lbk(o.labCode,o.ccode,o.icode,o.batch);
        DB.labBalances[lk_]=(DB.labBalances[lk_]||0)+dlvQty;
      }
      // الكونتر: لو خرج مع البضاعة فعلاً ينتقل من رصيد المخزن لرصيد معمل العميل
      if(o.counterCode&&o.counterWithGoods&&o.labCode){
        const cq=+o.counterQty||1;
        DB.counterBalances['WH|'+o.counterCode]=(DB.counterBalances['WH|'+o.counterCode]||0)-cq;
        DB.counterBalances[o.labCode+'|'+o.counterCode]=(DB.counterBalances[o.labCode+'|'+o.counterCode]||0)+cq;
        o.counterStatus='تم التسليم';
        const counterObj=DB.counters.find(c=>c.code===o.counterCode);
        if(counterObj){counterObj.status='ممتلئ';}
        DB.counterLabMeta[o.labCode+'|'+o.counterCode]={since:Date.now(),deliveredAt:Date.now()};
        logCounterMove(o.counterCode,'خروج مع البضاعة',cq,'المخزن',o.labName||o.labCode,0,'أوردر صرف: '+(o.inv||o.id));
      }
    }
    // لو تسليم جزئي → أنشئ أوردر إرجاع تلقائياً (يبدأ بتأكيد المندوب ثم الحسابات ثم المخازن) — نفس الطريقة تنطبق على الأوردر العادي (SMS) أيضاً، مع عدم لمس رصيد الأمانة له عند التأكيد النهائي
    if(retQty>0){
      const ret={
        id:uid('ret'),kind:'return',stage:'return_pending_rep',
        cby:o.cby,cbyn:o.cbyn,createdAt:Date.now(),updAt:Date.now(),
        ccode:o.ccode,cname:o.cname,icode:o.icode,iname:o.iname,
        batch:o.batch,qty:retQty,sector:o.sector||'',sectorName:o.sectorName||sname(o.sector),
        repName:o.repName,carNo:o.carNo,orderType:o.orderType,
        originalId:id,note:'مرتجع تلقائي — الكمية المُسلَّمة: '+dlvQty+' من '+o.qty
      };
      DB.orders.push(ret);
    }
    await svo();await svlb();await svcb();await svco();await svclm();
    const msg=retQty>0
      ?`✅ تم تسليم ${dlvQty} — أوردر إرجاع تلقائي للكمية المتبقية (${retQty})`
      :'✅ تم التسليم الكامل وتحديث الرصيد';
    toast(msg);S.tab='home';S.oid=null;render();
  };

  // محاولة الحصول على الموقع — نستخدم أولاً موقعاً مُجهَّزاً مسبقاً (أسرع وأضمن على الموبايل)
  if(preFetchedLoc&&(Date.now()-preFetchedLocAt)<10*60*1000){
    await finish(preFetchedLoc);
    return;
  }
  if(navigator.geolocation){
    if(!window.isSecureContext){
      toast('⚠️ تحديد الموقع يعمل فقط عبر رابط https — لن يُسجَّل الموقع');
    }
    navigator.geolocation.getCurrentPosition(
      pos=>finish(`${pos.coords.latitude},${pos.coords.longitude}`),
      ()=>{
        // محاولة ثانية بدقة أقل ومهلة أطول (مفيدة داخل المباني)
        navigator.geolocation.getCurrentPosition(
          pos=>finish(`${pos.coords.latitude},${pos.coords.longitude}`),
          ()=>{
            // محاولة أخيرة متساهلة جداً — تقبل أي موقع مخزّن حديثاً بالمتصفح
            navigator.geolocation.getCurrentPosition(
              pos=>finish(`${pos.coords.latitude},${pos.coords.longitude}`),
              ()=>{toast('⚠️ تعذّر تحديد الموقع — تأكد من تفعيل صلاحية الموقع للمتصفح من إعدادات الهاتف');finish(null);},
              {timeout:20000,enableHighAccuracy:false,maximumAge:600000}
            );
          },
          {timeout:15000,enableHighAccuracy:false}
        );
      },
      {timeout:10000,enableHighAccuracy:true}
    );
  } else {
    toast('⚠️ المتصفح لا يدعم تحديد الموقع');
    await finish(null);
  }
}

async function onN2Fill(e){
  e.preventDefault();const f=new FormData(e.target);
  const counterCode=f.get('counterCode')?.trim(),labCode=f.get('labCode')?.trim(),liters=+f.get('liters')||0;
  if(!counterCode){toast('⛔ اختاري الكونتر');return;}
  if(!labCode){toast('⛔ اختاري المعمل');return;}
  if(!liters||liters<=0){toast('⛔ أدخلي كمية نتروجين صحيحة');return;}
  const counter=DB.counters.find(c=>c.code===counterCode);
  if(!counter){toast('⛔ الكونتر غير موجود');return;}
  if(counter.owner&&counter.owner!==S.user.username&&S.user.role!=='admin'){
    toast(`⛔ الكونتر ده مسؤوليّة ${u2n(counter.owner)} فقط`);return;
  }
  const lab=DB.labs.find(l=>l.code===labCode);
  if(!lab){toast('⛔ المعمل غير موجود');return;}
  if(cbal(labCode,counterCode)<=0){toast('⛔ هذا الكونتر غير موجود حالياً عند هذا المعمل');return;}
  if(liters>n2bal('WH')){toast(`⛔ الكمية المطلوبة (${liters}) أكبر من رصيد المخزن المتاح (${n2bal('WH')})`);return;}
  DB.nitrogenBalances['WH']=n2bal('WH')-liters;
  DB.nitrogenBalances[labCode]=n2bal(labCode)+liters;
  await svn2();
  counter.status='ممتلئ';await svco();
  DB.counterLabMeta[labCode+'|'+counterCode]={...(DB.counterLabMeta[labCode+'|'+counterCode]||{}),since:Date.now()};
  await svclm();
  await logCounterMove(counter.code,'تزويد نتروجين',0,'المخزن',lab.name,liters,'خُصم من رصيد نتروجين المخزن');
  toast(`✅ تم تزويد ${liters} لتر لمعمل ${lab.name} وخصمها من المخزن`);e.target.reset();render();
}

async function onCounterReturn(e){
  e.preventDefault();const f=new FormData(e.target);
  const labCode=f.get('labCode')?.trim(),counterCode=f.get('counterCode')?.trim(),qty=+f.get('qty')||0;
  if(!labCode){toast('⛔ اختاري المعمل');return;}
  if(!counterCode){toast('⛔ اختاري الكونتر');return;}
  if(!qty||qty<=0){toast('⛔ أدخلي كمية صحيحة');return;}
  const lab=DB.labs.find(l=>l.code===labCode);if(!lab){toast('⛔ المعمل غير موجود');return;}
  const counter=DB.counters.find(c=>c.code===counterCode);if(!counter){toast('⛔ الكونتر غير موجود');return;}
  if(counter.owner&&counter.owner!==S.user.username&&S.user.role!=='admin'){
    toast(`⛔ الكونتر ده مسؤوليّة ${u2n(counter.owner)} فقط — هو المخوّل باسترجاعه`);return;
  }
  const avail=cbal(labCode,counter.code);
  if(avail<=0){toast('⛔ لا يوجد رصيد لهذا الكونتر عند هذا المعمل');return;}
  if(qty>avail){toast(`⛔ الكمية أكبر من المتاح (${avail})`);return;}
  DB.counterBalances[labCode+'|'+counter.code]=avail-qty;
  if(DB.counterBalances[labCode+'|'+counter.code]===0){
    delete DB.counterBalances[labCode+'|'+counter.code];
    delete DB.counterLabMeta[labCode+'|'+counter.code];
    await svclm();
  }
  await svcb();
  await logCounterMove(counter.code,'رجوع للمخزن (بدء)',qty,lab.name,'في الطريق للمخزن',0,'');
  const o={id:uid('cr'),kind:'counter_return',stage:'counter_return_pending_wh',
    cby:S.user.username,cbyn:S.user.name,createdAt:Date.now(),updAt:Date.now(),
    ccode:labCodes(lab)[0]||'',cname:labCustNames(lab),labCode,labName:lab.name,
    counterCode:counter.code,counterName:cnname(counter.code),qty,
    note:'استرجاع كونتر من معمل '+lab.name};
  DB.orders.push(o);await svo();
  toast('✅ تم بدء دورة استرجاع الكونتر — بانتظار تأكيد المخزن');e.target.reset();render();
}
