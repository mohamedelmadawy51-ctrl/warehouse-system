async function doCustReturn(id){
  const o=DB.orders.find(x=>x.id===id);if(!o)return;
  // لو الأوردر الأصلي "إضافة" لسه في أمانة المخزن، أو "صرف" وصل فعلاً لمعمل العميل
  const sourcePool = (o.kind==='addition') ? 'warehouse' : 'lab';
  const curBal = sourcePool==='warehouse' ? gb(o.ccode,o.icode,o.batch) : (o.labCode?glb(o.labCode,o.ccode,o.icode,o.batch):0);
  const poolLabel = sourcePool==='warehouse' ? 'أمانة المخزن' : `معمل ${o.labName||''}`;
  if(!o.labCode&&sourcePool==='lab'){toast('⛔ لا يوجد معمل مرتبط بهذا الأوردر');return;}
  if(curBal<=0){toast(`⛔ لا يوجد رصيد حالي لهذا الصنف/الباتش في ${poolLabel} لعمل سحوبات منه`);return;}
  const retQty=+prompt(`سحوبات من ${poolLabel}\nالرصيد الحالي المتاح: ${curBal}\nأدخل الكمية المطلوب سحبها:`||0);
  if(!retQty||retQty<=0){toast('لم يتم تحديد كمية');return;}
  if(retQty>curBal){toast(`⛔ الكمية المطلوبة (${retQty}) أكبر من الرصيد الحالي (${curBal})`);return;}
  const ret={
    id:uid('cret'),kind:'customer_return',stage:'customer_return_pending_acc',
    cby:o.cby,cbyn:o.cbyn,createdAt:Date.now(),updAt:Date.now(),
    ccode:o.ccode,cname:o.cname,icode:o.icode,iname:o.iname,
    batch:o.batch,qty:retQty,sector:o.sector||'',sectorName:o.sectorName||sname(o.sector),
    repName:o.repName,originalId:id,sourcePool,labCode:sourcePool==='lab'?o.labCode:'',labName:sourcePool==='lab'?o.labName:'',
    note:'سحوبات بطلب '+u2n(o.cby)+' — من الأوردر: '+(o.inv||id)+' ('+poolLabel+')'
  };
  DB.orders.push(ret);await svo();
  toast('✅ تم فتح طلب سحوبات وإرساله للحسابات');S.tab='home';S.oid=null;render();
}
function u2n(username){const u=DB.users.find(x=>x.username===username);return u?u.name:username;}

async function doCancel(id){
  const o=DB.orders.find(x=>x.id===id);if(!o)return;
  if(S.user.role!=='admin'){toast('⛔ فقط المدير يمكنه إلغاء العمليات');return;}
  if(!confirm('هل أنت متأكد من إلغاء هذه العملية بالكامل؟ سيتم حذفها من السجلات.')) return;
  // Reverse balance if needed
  // عكس الرصيد حسب نوع الأوردر
  if((o.kind==='return'||o.kind==='customer_return')&&o.balAdded){const k=bk(o.ccode,o.icode,o.batch);DB.balances[k]=(DB.balances[k]||0)-(+o.qty);if(DB.balances[k]===0)delete DB.balances[k];}
  else if(o.kind==='addition'&&o.balAdded){
    const k=bk(o.ccode,o.icode,o.batch);
    DB.balances[k]=(DB.balances[k]||0)-(+o.qty);
    if(DB.balances[k]===0) delete DB.balances[k];
  }
  if((o.kind==='withdrawal')&&o.balDeducted){
    const k=bk(o.ccode,o.icode,o.batch);
    DB.balances[k]=(DB.balances[k]||0)+(+o.qty);
  }
  DB.orders=DB.orders.filter(x=>x.id!==id);
  await svo();toast('✅ تم إلغاء العملية وحذفها من السجلات');S.tab='home';S.oid=null;render();
}

function doXLSLabCounters(){
  if(typeof XLSX==='undefined'){toast('جارِ تحميل مكتبة Excel...');return;}
  const q=(S.labCntSrch||'').trim().toLowerCase();
  let rows=Object.keys(DB.counterLabMeta).map(key=>{
    const[labCode,counterCode]=key.split('|');
    const lab=DB.labs.find(l=>l.code===labCode);
    const counter=DB.counters.find(c=>c.code===counterCode);
    if(!lab||!counter)return null;
    const st=labCounterStatus(labCode,counterCode);
    return{labCode,counterCode,lab,counter,...st};
  }).filter(Boolean);
  if(q){
    rows=rows.filter(r=>r.lab.name.toLowerCase().includes(q)||r.counterCode.toLowerCase().includes(q)||labCustNames(r.lab).toLowerCase().includes(q)||r.status.toLowerCase().includes(q)||(r.needsRefill?'نعم':'لا').includes(q));
  }
  rows.sort((a,b)=>(b.since||0)-(a.since||0));
  if(!rows.length){toast('⚠️ لا توجد بيانات لتصديرها');return;}
  const hd=[['الكونتر','المعمل','العميل','تاريخ التسليم','الأيام','الفقد المتوقع %','المتبقي (لتر)','يحتاج تزويد','الحالة']];
  rows.forEach(r=>{
    hd.push([
      r.counterCode,r.lab.name,labCustNames(r.lab),
      r.since?new Date(r.since).toLocaleDateString('ar-EG'):'-',
      r.days,r.lossPct.toFixed(0)+'%',r.remaining.toFixed(1),
      r.needsRefill?'نعم':'لا',r.status
    ]);
  });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(hd),'متابعة الكونترات');
  XLSX.writeFile(wb,'IFT_LabCounters_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function doXLS(){
  if(typeof XLSX==='undefined'){toast('جارِ تحميل مكتبة Excel...');return;}
  const wb=XLSX.utils.book_new();
  const hd=[['التاريخ','النوع','رقم الأمر','العميل','الصنف','التشغيلة (Batch)','تاريخ الانتهاء','الكمية','الحالة','المندوب','رقم العربية','المعمل','مسؤول الخدمة/الدكتور','بواسطة','ملحوظة']];
  DB.orders.forEach(o=>{
    const doctorName = o.kind==='withdrawal'&&o.counterCode ? u2n((DB.counters.find(c=>c.code===o.counterCode)||{}).owner) : (o.cby?u2n(o.cby):'-');
    const kindLabel = o.kind==='addition'?'إضافة':o.kind==='withdrawal'?(o.orderType==='regular'?'أوردر عادي (SMS)':'صرف من الأمانة'):o.kind==='return'?'إرجاع':o.kind==='customer_return'?'سحوبات':o.kind==='lab_transfer'?'تحويل بين معامل':o.kind==='consumption'?'استهلاك':o.kind==='counter_return'?'استرجاع كونتر':'تحويل';
    hd.push([
      new Date(o.createdAt||Date.now()).toLocaleDateString('ar-EG'),
      kindLabel,
      o.inv||'-',o.cname||o.fcname||o.ccode||'-',o.iname||o.icode||'-',
      o.batch||'-',o.expiry||'-',o.qty||'-',
      stageLabel(o),o.repName||'-',o.carNo||'-',o.labName||'-',doctorName||'-',
      o.cbyn||o.cby||'-',o.note||''
    ]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(hd),'الحركات');
  const regHd=[['التاريخ','رقم الأمر','العميل','الصنف','التشغيلة','الكمية','الحالة','بواسطة','ملحوظة']];
  DB.orders.filter(o=>o.kind==='withdrawal'&&o.orderType==='regular').forEach(o=>{
    regHd.push([new Date(o.createdAt||Date.now()).toLocaleDateString('ar-EG'),o.inv||'-',o.cname||o.ccode||'-',o.iname||o.icode||'-',o.batch||'-',o.qty||'-',stageLabel(o),o.cbyn||o.cby||'-',o.note||'']);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(regHd),'أوردرات عادية SMS');
  const bd=[['كود العميل','اسم العميل','كود الصنف','اسم الصنف','التشغيلة (Batch)','تاريخ الانتهاء','مسؤول الخدمة/الدكتور','الرصيد (أمانة المخزن)']];
  Object.entries(DB.balances).forEach(([k,qty])=>{
    const parts=k.split('|');const cc=parts[0],ic=parts[1],batch=parts[2]||'';
    const c=fc(cc);const it=fi(ic);const exp=findExpiry(cc,ic,batch);
    const dEntryOrder=DB.orders.find(o=>o.kind==='addition'&&o.ccode===cc&&o.icode===ic&&o.stage!=='rejected');
    bd.push([cc,c?c.name:'',ic,it?it.name:'',batch||'-',exp||'-',dEntryOrder?u2n(dEntryOrder.cby):'-',qty]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(bd),'أمانة المخزن');
  const ld=[['كود العميل','اسم العميل','المعمل','كود الصنف','اسم الصنف','التشغيلة (Batch)','تاريخ الانتهاء','الرصيد بالمعمل']];
  Object.entries(DB.labBalances).forEach(([k,qty])=>{
    const parts=k.split('|');const labCode=parts[0],cc=parts[1],ic=parts[2],batch=parts[3]||'';
    const lab=DB.labs.find(l=>l.code===labCode);const c=fc(cc);const it=fi(ic);
    const exp=findExpiry(cc,ic,batch);
    ld.push([cc||'-',c?c.name:'-',lab?lab.name:labCode,ic,it?it.name:'',batch||'-',exp||'-',qty]);
  });
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ld),'أرصدة المعامل');
  XLSX.writeFile(wb,'IFT_Amana_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
